name: terraform-quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        directory:
          - .
          - modules/records
          - modules/health-checks
          - examples/minimal
          - examples/public-zone
          - examples/private-zone
          - examples/routing-policies
          - examples/dnssec-and-query-logging
          - examples/multiple-zones
    uses: hatan4ik/terraform-pipelines/.github/workflows/terraform-quality.yml@8fc2a04c7931dd449097bb92b15b085278e3f67a # v0.1.1
    with:
      working_directory: ${{ matrix.directory }}
      check_docs: true
